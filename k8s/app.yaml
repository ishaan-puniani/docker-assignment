# Replace ishaanpuniani with your Docker Hub username before applying.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
type: Opaque
stringData:
  username: admin
  password: change-me   # demo only; see README "Security"
---
# Persistent storage: survives pod/node/cluster restarts
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1            # database is not scaled
  strategy:
    type: Recreate       # never two mongo pods on the same volume
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports: [{ containerPort: 27017 }]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: { secretKeyRef: { name: mongo-secret, key: username } }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mongo-secret, key: password } }
          volumeMounts:
            - { name: data, mountPath: /data/db }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mongo-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector: { app: mongo }
  ports: [{ port: 27017 }]          # ClusterIP: internal only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: notes-api }
  template:
    metadata:
      labels: { app: notes-api }
    spec:
      containers:
        - name: notes-api
          image: ishaanpuniani/notes-api:1.0
          ports: [{ containerPort: 5000 }]
          env:
            - name: MONGO_USER
              valueFrom: { secretKeyRef: { name: mongo-secret, key: username } }
            - name: MONGO_PASS
              valueFrom: { secretKeyRef: { name: mongo-secret, key: password } }
            - name: MONGO_URL
              value: mongodb://$(MONGO_USER):$(MONGO_PASS)@mongo:27017/?authSource=admin
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: notes-api
spec:
  selector: { app: notes-api }
  ports: [{ port: 5000 }]           # ClusterIP: internal only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: ishaanpuniani/notes-web:1.0
          ports: [{ containerPort: 5000 }]
          env:
            - name: NOTES_API_URL
              value: http://notes-api:5000
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
# Only entry point from outside the cluster
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector: { app: web }
  ports: [{ port: 80, targetPort: 5000, nodePort: 30080 }]
